name: OFF seed tests

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/seed/**"
      - ".github/workflows/off-seed.yml"
      - ".github/workflows/off-seed-tests.yml"
  push:
    branches: [main]
    paths:
      - "scripts/seed/**"
      - ".github/workflows/off-seed.yml"
      - ".github/workflows/off-seed-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: off-seed-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test export schema compatibility
        run: python3 -m unittest discover -s scripts/seed -p 'test_*.py' -v
